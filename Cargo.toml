[package]
name = "space_track"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A Rust client for the Space-Track API"
repository = "https://github.com/onestopjs/space_track"
readme = "README.md"
keywords = ["space-track", "space", "track", "api", "client"]
categories = ["aerospace", "api-bindings"]

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "charset",
    "http2",
    "system-proxy",
] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.116"
thiserror = "1.0.59"

[features]
default = ["native-tls"]
native-tls = ["reqwest/native-tls"]
rustls-tls = ["reqwest/rustls-tls"]
